name: Verify portfolio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Install from the committed lockfile.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests for standalone guided previews
        run: npm test
      - name: Type-check and production build
        run: npm run build
      - name: Verify interactive desktop and mobile journeys
        run: |
          npx playwright install --with-deps chromium
          LEDGER_SCREENSHOTS="$RUNNER_TEMP/ledger-visual" node scripts/local-browser-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ledger-visual-review
          path: ${{ runner.temp }}/ledger-visual/
          if-no-files-found: warn

