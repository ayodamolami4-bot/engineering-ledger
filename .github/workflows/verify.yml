name: Verify portfolio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Once a lockfile is generated, change install to npm ci.
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests for standalone guided previews
        run: npm test
      - name: Type-check and production build
        run: npm run build
